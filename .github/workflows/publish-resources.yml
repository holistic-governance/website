name: Publish resources to website

# Triggered only by the dashboard's "Publish to website" button, which sends the
# full resource list in the dispatch payload. There is no scheduled run: the
# dashboard API sits behind IAP, so CI cannot pull the list itself.
on:
  repository_dispatch:
    types: [resources_published]

concurrency:
  group: publish-resources
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Write resources payload to file
        env:
          RESOURCES_JSON: ${{ toJson(github.event.client_payload.resources) }}
        run: printf '%s' "$RESOURCES_JSON" > "$RUNNER_TEMP/resources.json"
      - name: Build resources HTML + JSON-LD
        run: node build-resources.js "$RUNNER_TEMP/resources.json"
      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain resources.html)" ]; then
            git add resources.html
            git commit -m "Auto-publish resources from dashboard"
            git push
          else
            echo "No changes to publish."
          fi
